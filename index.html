<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CUB Bank - Login</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="icon" type="image/png" href="images/icon.png">
</head>
<body>
    <div class="container">
        <div class="login-container">
            <div class="login-header">
                <img src="images/logo.png" alt="CUB Bank Logo" class="logo">
                <h1>Welcome to CUB Bank</h1>
                <p>Secure Banking at Your Fingertips</p>
            </div>
            
            <form id="loginForm" class="login-form">
                <div class="form-group">
                    <label for="username">Username</label>
                    <input type="text" id="username" name="username" required placeholder="Enter your username">
                </div>
                
                <div class="form-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" name="password" required placeholder="Enter your password">
                </div>
                
                <button type="submit" class="btn btn-primary">Login</button>
                
                <div class="form-footer">
                    <p>Don't have an account? <a href="#" id="registerLink">Register here</a></p>
                </div>
            </form>
            
            <form id="registerForm" class="login-form hidden">
                <div class="form-group">
                    <label for="regUsername">Username</label>
                    <input type="text" id="regUsername" name="regUsername" required placeholder="Choose a username">
                </div>
                
                <div class="form-group">
                    <label for="regPassword">Password</label>
                    <input type="password" id="regPassword" name="regPassword" required placeholder="Choose a password">
                </div>
                
                <div class="form-group">
                    <label for="regEmail">Email</label>
                    <input type="email" id="regEmail" name="regEmail" required placeholder="Enter your email">
                </div>
                
                <button type="submit" class="btn btn-primary">Register</button>
                
                <div class="form-footer">
                    <p>Already have an account? <a href="#" id="loginLink">Login here</a></p>
                </div>
            </form>
            
            <div id="errorMessage" class="error-message hidden"></div>
        </div>
    </div>
    
    <script src="auth.js"></script>
</body>
</html>
